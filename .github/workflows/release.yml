# タグ起点の公開。v* タグの push で CI の検査を再実行し、
# 通ったときだけ GoReleaser が GitHub Releases へバイナリを公開する。
# 検査の内容は ci.yml が正典で、ここには公開の手順だけを書く。
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
