# 品質の門番。push と PR のたびに検査を実行する。
# release.yml が workflow_call で同じ検査を再実行してから公開するため、
# 検査の内容はこのファイルだけが持つ（写しを作らない）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: make build
      - name: install.shの構文を確認する
        run: sh -n scripts/install.sh
      - name: install.shをshellcheckで確認する
        run: shellcheck scripts/install.sh

  # 検証が通る構成で、コマンドが実際に動くことを確かめる。
  # mdtrace 自身の文書は Go のテストが検証する。
  self-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - name: 文書を検証する
        run: ../../bin/mdtrace verify
        working-directory: testdata/good
      - name: 欠落を確認する
        # testdata/good は欠落を含むサンプルのため、失敗させない
        run: ../../bin/mdtrace gaps || true
        working-directory: testdata/good
      - name: 対応表を保存する
        run: ../../bin/mdtrace matrix --output ../../traceability.md
        working-directory: testdata/good
      - uses: actions/upload-artifact@v4
        with:
          name: traceability
          path: traceability.md
